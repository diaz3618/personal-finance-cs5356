name: Build and push Docker images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: meta
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pf-tracker-app:latest
            ghcr.io/${{ github.repository_owner }}/pf-tracker-app:sha-${{ steps.meta.outputs.sha_short }}

      - name: Build and push mysql image
        uses: docker/build-push-action@v7
        with:
          context: ./database
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pf-tracker-mysql:latest
            ghcr.io/${{ github.repository_owner }}/pf-tracker-mysql:sha-${{ steps.meta.outputs.sha_short }}
