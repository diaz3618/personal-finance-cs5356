apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pf-tracker
  namespace: pf-tracker
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
