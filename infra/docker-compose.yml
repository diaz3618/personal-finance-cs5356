services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file: ../.env
    environment:
      MYSQL_INITDB_SKIP_TZINFO: "1"
    ports:
      - "3306:3306"
    volumes:
      - pf_mysql_data:/var/lib/mysql
      - ../database/init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  app:
    build: ../app
    restart: unless-stopped
    env_file: ../.env
    environment:
      DB_HOST: mysql
    ports:
      - "3010:3000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  pf_mysql_data:
