<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign In — pf-tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
</head>
<body class="antialiased d-flex flex-column" data-page="login">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <span class="navbar-brand navbar-brand-autodark h2">pf-tracker</span>
      </div>
      <div class="card card-md">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Sign in</h2>
          <div id="sign-in"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/config.js"></script>
  <script>
    (async () => {
      const pk = window.CLERK_PK;
      const domain = atob(pk.split('_')[2]).slice(0, -1);
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = `https://${domain}/npm/@clerk/clerk-js@latest/dist/clerk.browser.js`;
        s.setAttribute('data-clerk-publishable-key', pk);
        s.crossOrigin = 'anonymous';
        s.onload = res;
        s.onerror = () => rej(new Error('Clerk bundle failed to load'));
        document.head.appendChild(s);
      });
      await window.Clerk.load();
      if (window.Clerk.isSignedIn) {
        location.href = '/';
        return;
      }
      window.Clerk.mountSignIn(document.getElementById('sign-in'));
    })();
  </script>
</body>
</html>
