<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Transaction</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body data-page="add-transaction">
  <main class="card">
    <h1>Add Transaction</h1>

    <form id="transaction-form" class="stack">
      <label>
        Amount
        <input type="number" id="amount" name="amount" step="0.01" min="0.01" required />
      </label>

      <label>
        Date
        <input type="date" id="date" name="date" required />
      </label>

      <label>
        Type
        <select id="type" name="type" required>
          <option value="Expense">Expense</option>
          <option value="Income">Income</option>
        </select>
      </label>

      <label>
        Category
        <select id="category" name="categoryId" required></select>
      </label>

      <label>
        Description
        <input type="text" id="description" name="description" maxlength="255" />
      </label>

      <button type="submit" class="btn">Save Transaction</button>
    </form>

    <p id="form-status" class="status" role="status" aria-live="polite"></p>

    <a class="btn btn-ghost" href="index.html">Back to Home</a>
  </main>
  <script src="script.js"></script>
</body>
</html>
