<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Transactions — pf-tracker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body class="antialiased" data-page="transactions">
  <div class="wrapper">
    <aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        <a href="/" class="navbar-brand">pf-tracker</a>
        <div class="collapse navbar-collapse" id="navbar-menu">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="/">Dashboard</a>
            </li>
            <li class="nav-item active">
              <a class="nav-link" href="/transactions.html">Transactions</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/categories.html">Categories</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/budgets.html">Budgets</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/reports.html">Reports</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/profile.html">Profile</a>
            </li>
          </ul>
          <div class="mt-auto p-3">
            <button type="button" class="btn btn-ghost-danger w-100" id="sign-out-btn">Sign out</button>
          </div>
        </div>
      </div>
    </aside>

    <div class="page-wrapper">
      <div class="page-header d-print-none">
        <div class="container-xl">
          <div class="row g-2 align-items-center">
            <div class="col-auto">
              <h2 class="page-title">Transactions</h2>
            </div>
          </div>
        </div>
      </div>

      <div class="page-body">
        <div class="container-xl">

          <div class="card mb-3" id="filter-bar">
            <div class="card-body">
              <div class="row g-3 align-items-end">
                <div class="col-sm-auto">
                  <label class="form-label">From</label>
                  <input type="date" id="filter-date-from" class="form-control" />
                </div>
                <div class="col-sm-auto">
                  <label class="form-label">To</label>
                  <input type="date" id="filter-date-to" class="form-control" />
                </div>
                <div class="col-sm">
                  <label class="form-label">Category</label>
                  <select id="filter-category" class="form-select">
                    <option value="">All categories</option>
                  </select>
                </div>
                <div class="col-sm-auto">
                  <label class="form-label">Type</label>
                  <select id="filter-type" class="form-select">
                    <option value="">All types</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                  </select>
                </div>
                <div class="col-auto">
                  <button type="button" class="btn btn-secondary" id="filter-reset">Reset</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card mb-3">
            <div class="table-responsive" id="transaction-table">
              <table class="table table-vcenter card-table">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Type</th>
                    <th>Notes</th>
                    <th class="text-end">Amount</th>
                    <th class="w-1"></th>
                  </tr>
                </thead>
                <tbody id="transaction-list"></tbody>
              </table>
            </div>
            <div class="card-footer" id="pagination"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <h3 class="card-title">Add Transaction</h3>
            </div>
            <div class="card-body">
              <form id="transaction-form">
                <div class="row g-3">
                  <div class="col-sm-3">
                    <label class="form-label">Amount</label>
                    <input type="number" name="amount" step="0.01" min="0.01" class="form-control" required />
                  </div>
                  <div class="col-sm-3">
                    <label class="form-label">Date</label>
                    <input type="date" name="date" class="form-control" required />
                  </div>
                  <div class="col-sm-3">
                    <label class="form-label">Type</label>
                    <select name="type" class="form-select" required>
                      <option value="">Choose…</option>
                      <option value="expense">Expense</option>
                      <option value="income">Income</option>
                    </select>
                  </div>
                  <div class="col-sm-3">
                    <label class="form-label">Category</label>
                    <select id="tx-category" name="categoryId" class="form-select" required>
                      <option value="">Choose…</option>
                    </select>
                  </div>
                  <div class="col-12">
                    <label class="form-label">Notes</label>
                    <input type="text" name="notes" class="form-control" maxlength="255" />
                  </div>
                  <div class="col-auto">
                    <button type="submit" class="btn btn-primary">Add</button>
                  </div>
                </div>
                <p id="form-status" class="mt-2 mb-0 small" role="status" aria-live="polite"></p>
              </form>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="/script.js"></script>
</body>
</html>
